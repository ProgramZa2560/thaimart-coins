image: ghcr.io/cirruslabs/flutter:3.47.2

variables:
  COINRANKING_API_KEY: $COINRANKING_API_KEY

stages:
  - analyze
  - test
  - scan
  - build
  - deploy

flutter-analyze:
  stage: analyze
  script:
    - flutter pub get
    - flutter analyze --fatal-infos

flutter-test:
  stage: test
  script:
    - flutter pub get
    - flutter test --coverage
    - lcov --summary coverage/lcov.info || true
  coverage: '/lines\.+: (\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

code-scan:
  stage: scan
  allow_failure: true
  script:
    - flutter pub get
    - flutter pub outdated
    - |
      echo "Checking for committed secrets..."
      ! grep -rInE "(coinranking|api[_-]?key|secret|token)\s*[:=]\s*['\"][A-Za-z0-9]{20,}" lib/

build-android:
  stage: build
  script:
    - flutter pub get
    - flutter build appbundle --release
      --dart-define=COINRANKING_API_KEY=$COINRANKING_API_KEY
    - flutter build apk --release
      --dart-define=COINRANKING_API_KEY=$COINRANKING_API_KEY
  artifacts:
    paths:
      - build/app/outputs/bundle/release/
      - build/app/outputs/flutter-apk/
    expire_in: 1 week

build-ios:
  stage: build
  script:
    - flutter pub get
    - flutter build ios --release --no-codesign
      --dart-define=COINRANKING_API_KEY=$COINRANKING_API_KEY
    - cd build/ios/iphoneos
    - mkdir Payload
    - cp -r Runner.app Payload/
    - zip -r ../Runner.ipa Payload
  artifacts:
    paths:
      - build/ios/Runner.ipa
    expire_in: 1 week
  tags:
    - macos

build-web:
  stage: build
  script:
    - flutter pub get
    - flutter build web --release
      --dart-define=COINRANKING_API_KEY=$COINRANKING_API_KEY
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

deploy-web:
  stage: deploy
  environment:
    name: production
  script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - rsync -avz --delete build/web/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
  only:
    - main
