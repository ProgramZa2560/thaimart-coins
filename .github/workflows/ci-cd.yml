name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  scan:
    name: Code Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          echo "Checking for committed secrets..."
          if grep -rInE "(coinranking|api[_-]?key|secret|token)\s*[:=]\s*['\"][A-Za-z0-9]{20,}" lib/; then
            echo "::error::Potential secret found in source"
            exit 1
          fi
      - name: Dependency audit
        if: github.event_name == 'pull_request'
        run: |
          flutter pub get || true
          flutter pub outdated || true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build appbundle --release \
            --dart-define=COINRANKING_API_KEY=${{ secrets.COINRANKING_API_KEY }}
          flutter build apk --release \
            --dart-define=COINRANKING_API_KEY=${{ secrets.COINRANKING_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/
            build/app/outputs/flutter-apk/
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build ios --release --no-codesign \
            --dart-define=COINRANKING_API_KEY=${{ secrets.COINRANKING_API_KEY }}
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../Runner.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/Runner.ipa
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze, test, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build web --release \
            --dart-define=COINRANKING_API_KEY=${{ secrets.COINRANKING_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web/
          retention-days: 7

  deploy-web:
    name: Deploy Web to Server
    runs-on: ubuntu-latest
    needs: [build-web]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: build/web/
      - name: Rsync to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          eval $(ssh-agent -s)
          echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete build/web/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
